name: Alpha22x Daily Check

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  TZ: Europe/Berlin
  
# Needed because we commit state.json back to the repo
permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug — run context
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Ref:   ${{ github.ref }}"
          echo "SHA:   ${{ github.sha }}"
          echo "UTC time:"
          date -u
          echo "Local time (TZ=${TZ}):"
          date

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run runner.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python runner.py

      # Persist Telegram update offset across runs (state.json) so "fill ..." replies are processed once
      - name: Commit state.json if changed
        run: |
          git config user.name "alpha22x-bot"
          git config user.email "alpha22x-bot@users.noreply.github.com"

          git add state.json || true

          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi

          git commit -m "Update Telegram state"
          git push
